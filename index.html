<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarGPT — Automotive Assistant</title>
<meta name="description" content="CarGPT is an AI assistant for maintenance, diagnostics, buying advice and EV questions.">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --black: #0a0a0a;
    --white: #ffffff;
    --surface: #f8f9fa;
    --surface-2: #f3f4f6;
    --border: #e5e7eb;
    --border-strong: #0a0a0a;
    --muted: #6b7280;
    --sidebar-w: 288px;
    --content-w: 760px;
    --radius: 2px;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    color: var(--black);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100%; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    display: flex; flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    min-height: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 20px 16px;
  }
  .brand-mark {
    width: 28px; height: 28px; background: var(--black); color: var(--white);
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px; letter-spacing: -0.02em;
  }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }

  .new-chat {
    margin: 0 20px 20px;
    padding: 11px 14px;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--black); color: var(--white);
    font-weight: 500; font-size: 14px;
    border-radius: var(--radius);
    transition: background .15s;
  }
  .new-chat:hover { background: #262626; }
  .new-chat kbd {
    font-family: var(--mono); font-size: 11px; opacity: .6;
  }

  .section-label {
    padding: 0 20px 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .history { flex: 1; overflow-y: auto; padding: 0 12px 12px; margin: 0; list-style: none; }
  .history li { position: relative; }
  .history-item {
    display: block; width: 100%; text-align: left;
    padding: 9px 36px 9px 8px;
    font-size: 14px; color: #374151;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 2px solid transparent;
  }
  .history-item:hover { background: var(--surface-2); }
  .history-item[aria-current="true"] {
    color: var(--black); font-weight: 500;
    border-left-color: var(--black); background: var(--white);
  }
  .history-delete {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; color: var(--muted); font-size: 16px; line-height: 1;
    opacity: 0;
  }
  .history li:hover .history-delete, .history-delete:focus-visible { opacity: 1; }
  .history-delete:hover { color: var(--black); }
  .history-empty { padding: 4px 8px; color: var(--muted); font-size: 13px; }

  .sidebar-foot {
    padding: 16px 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 24px;
    border-bottom: 1px solid var(--border);
  }
  .menu-btn { display: none; width: 32px; height: 32px; border: 1px solid var(--border); }
  .topbar-title {
    font-size: 13px; font-weight: 500; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .column { max-width: var(--content-w); margin: 0 auto; padding: 0 24px; }

  /* ---------- Empty state ---------- */
  .hero { padding: 12vh 0 32px; }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    letter-spacing: .04em; margin: 0 0 20px;
  }
  .hero h1 {
    margin: 0 0 16px;
    font-size: clamp(36px, 6vw, 60px); line-height: 1.02;
    font-weight: 700; letter-spacing: -0.04em;
  }
  .hero p { margin: 0; max-width: 46ch; color: var(--muted); font-size: 16px; }

  .prompts {
    display: grid; grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--border-strong);
    margin-top: 40px;
  }
  .prompt {
    text-align: left; padding: 18px 16px 18px 0;
    border-bottom: 1px solid var(--border);
    display: grid; grid-template-columns: 32px 1fr; gap: 4px;
    transition: background .15s;
  }
  .prompt:nth-child(odd) { padding-right: 20px; }
  .prompt:nth-child(even) { padding-left: 20px; border-left: 1px solid var(--border); }
  .prompt:hover { background: var(--surface); }
  .prompt-num { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
  .prompt-title { font-weight: 600; font-size: 14px; display: block; }
  .prompt-sub { font-size: 13px; color: var(--muted); display: block; }

  /* ---------- Messages ---------- */
  .thread { padding: 32px 0 24px; display: flex; flex-direction: column; gap: 28px; }
  .msg { display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
  .msg-role {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); padding-top: 4px;
  }
  .msg.user .msg-body { font-weight: 500; }
  .msg.assistant .msg-body { padding-top: 0; }
  .msg-body p { margin: 0 0 12px; }
  .msg-body p:last-child, .msg-body ul:last-child { margin-bottom: 0; }
  .msg-body ul { margin: 0 0 12px; padding-left: 18px; }
  .msg-body li { margin-bottom: 4px; }
  .msg-body strong { font-weight: 600; }
  .msg-body .note {
    border-left: 2px solid var(--black); background: var(--surface);
    padding: 10px 14px; font-size: 14px; color: #374151;
  }
  .typing { display: inline-flex; gap: 4px; padding-top: 8px; }
  .typing span {
    width: 5px; height: 5px; background: var(--black); border-radius: 50%;
    animation: blink 1.2s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }

  /* ---------- Composer ---------- */
  .composer-wrap { padding: 12px 0 20px; background: var(--white); }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 10px 10px 10px 16px; background: var(--white);
  }
  .composer:focus-within { box-shadow: 0 0 0 3px rgba(10,10,10,.08); }
  .composer textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    max-height: 160px; min-height: 24px; line-height: 1.5; padding: 4px 0;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send {
    width: 36px; height: 36px; background: var(--black); color: var(--white);
    display: grid; place-items: center; border-radius: var(--radius);
    transition: background .15s, opacity .15s;
  }
  .send:hover:not(:disabled) { background: #262626; }
  .send:disabled { opacity: .25; cursor: not-allowed; }
  .composer-hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

  /* ---------- Mobile ---------- */
  .scrim { display: none; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: min(var(--sidebar-w), 86vw);
      z-index: 20; transform: translateX(-100%); transition: transform .2s ease;
    }
    .sidebar.open { transform: none; }
    .scrim.open { display: block; position: fixed; inset: 0; background: rgba(10,10,10,.4); z-index: 10; }
    .menu-btn { display: grid; place-items: center; }
    .topbar { padding: 0 16px; }
    .column { padding: 0 16px; }
    .prompts { grid-template-columns: 1fr; }
    .prompt:nth-child(even) { padding-left: 0; border-left: 0; }
    .prompt:nth-child(odd) { padding-right: 0; }
    .msg { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">C</div>
      <span class="brand-name">CarGPT</span>
    </div>
    <button class="new-chat" id="newChat" type="button">
      <span>New conversation</span><kbd>Ctrl K</kbd>
    </button>
    <div class="section-label">History</div>
    <ul class="history" id="history"></ul>
    <div class="sidebar-foot">Guidance only. Verify safety-critical work with a certified mechanic.</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open conversations" aria-controls="sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <span class="topbar-title" id="topTitle">New conversation</span>
    </header>

    <div class="scroll" id="scroll">
      <div class="column" id="stage"></div>
    </div>

    <div class="composer-wrap">
      <div class="column">
        <form class="composer" id="form" autocomplete="off">
          <label class="sr-only" for="input">Message CarGPT</label>
          <textarea id="input" rows="1" placeholder="Ask about maintenance, warning lights, EVs, buying…" maxlength="2000"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
          </button>
        </form>
        <p class="composer-hint">Enter to send · Shift+Enter for a new line</p>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";


  const KNOWLEDGE = [
    {
      match: /(warning|dash|light|check engine|mil\b)/i,
      answer:
`Dashboard lights are grouped by colour, which tells you how urgent they are.

- **Red** (oil pressure, battery, brake, coolant temperature): stop safely as soon as you can and switch the engine off.
- **Amber** (check engine, ABS, tyre pressure, traction control): the car is usable, but book a diagnosis soon.
- **Green / blue**: informational only (lights on, cruise control active).

A **flashing** check engine light means active misfire and can damage the catalytic converter. Reduce load and get it checked promptly.

> Tell me the exact symbol, make, model and year and I can narrow down likely causes.`
    },
    {
      match: /(tyre|tire|pressure|psi|bar\b)/i,
      answer:
`Use the pressure printed on the driver's door jamb or in the owner's manual, not the number moulded on the tyre sidewall.

- Check when tyres are **cold** (parked for 3+ hours or driven under 2 km).
- Check monthly and before long trips; add a few PSI of margin only if the manual specifies a loaded figure.
- Inspect tread depth: 1.6 mm is the legal minimum in many regions, but performance in rain drops well before that. Replace around 3 mm.
- Rotate every 8,000–10,000 km unless your manual says otherwise.

> A sudden drop of more than 4–5 PSI in a week usually points to a slow puncture or a leaking valve.`
    },
    {
      match: /(oil|service|maintenance|interval|schedule)/i,
      answer:
`Maintenance intervals depend on engine type and driving pattern, so the manual is the authority. As a general guide:

- **Engine oil and filter**: 10,000–15,000 km or 12 months for most modern engines on synthetic oil; shorter for heavy city, towing or dusty use.
- **Air filter**: 15,000–30,000 km.
- **Brake fluid**: every 2 years, regardless of mileage.
- **Coolant**: 4–5 years or per manual.
- **Spark plugs**: 40,000–100,000 km depending on plug type.

> Tell me the make, model, year and mileage and I can build a service checklist.`
    },
    {
      match: /(ev\b|electric|charging|charger|battery|range|kwh)/i,
      answer:
`For daily EV use, battery habits matter more than any single setting.

- Keep the state of charge between roughly **20% and 80%** for daily driving; charge to 100% only before long trips.
- Prefer AC charging at home. Frequent DC fast charging is fine, but it generates more heat over time.
- Precondition the battery in cold weather. Winter range loss of 20–30% is normal.
- Avoid leaving the car for long periods at very high or very low charge.

> Range estimates depend heavily on speed. At 120 km/h expect noticeably less than the rated figure.`
    },
    {
      match: /(buy|buying|used|purchase|inspection|worth)/i,
      answer:
`A short checklist for a used car:

- **History**: service records, number of owners, accident and mileage verification (VIN check).
- **Cold start**: listen for rattles, look for smoke from the exhaust, and check that the engine idles smoothly.
- **Body**: uneven panel gaps, paint mismatch and overspray suggest past repairs.
- **Drive**: check for pulling under braking, clunks over bumps and gearbox hesitation.
- **Inspection**: pay for an independent inspection; it costs little compared with a major repair.

> Share the model and asking price and I can list common faults for that generation.`
    },
    {
      match: /(fuel|mpg|economy|consumption|efficien|mileage per)/i,
      answer:
`Fuel economy is mostly driving behaviour and maintenance.

- Smooth acceleration and early lifting off the throttle make the biggest difference.
- Highway speed matters: drag grows with the square of speed, so 100 km/h is much cheaper than 130 km/h.
- Correct tyre pressure and removing roof boxes or racks when unused each recover a few percent.
- Short trips with a cold engine are the least efficient pattern.`
    },
    {
      match: /(brake|squeal|grind|pad|rotor|disc)/i,
      answer:
`Brake noise tells you roughly where to look.

- **High-pitched squeal** at low speed: often a wear indicator or glazed pads.
- **Grinding**: pads are likely worn through to the backing plate. Stop driving it and have it inspected, as rotors will be damaged quickly.
- **Pulsing pedal**: warped or unevenly worn rotors.
- **Soft pedal**: air or moisture in the fluid, or a leak. Treat as urgent.

> Brakes are safety-critical. Have any of these confirmed by a qualified technician.`
    }
  ];

  const FALLBACK =
`I can help with maintenance, diagnostics, tyres, brakes, EV charging, fuel economy and buying advice.

To give a useful answer, include the **make, model, year** and a short description of what you are seeing or hearing.

> Try: "My 2018 Corolla shakes at 100 km/h. What should I check first?"`;

  const CarGPTClient = {
    reply(history) {
      const last = history[history.length - 1].content;
      const hit = KNOWLEDGE.find(k => k.match.test(last));
      const text = hit ? hit.answer : FALLBACK;
      const delay = 500 + Math.random() * 400;
      return new Promise(resolve => setTimeout(() => resolve(text), delay));
    }
  };

  const STORE_KEY = "cargpt.v1";
  const state = { chats: [], activeId: null, busy: false };

  const uid = () => Math.random().toString(36).slice(2, 10);

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (raw && Array.isArray(raw.chats)) {
        state.chats = raw.chats;
        state.activeId = raw.activeId;
      }
    } catch (_) { /* storage unavailable: run in memory */ }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ chats: state.chats, activeId: state.activeId }));
    } catch (_) {}
  }
  const activeChat = () => state.chats.find(c => c.id === state.activeId) || null;


  const $ = id => document.getElementById(id);
  const els = {
    sidebar: $("sidebar"), scrim: $("scrim"), menuBtn: $("menuBtn"),
    history: $("history"), newChat: $("newChat"), topTitle: $("topTitle"),
    scroll: $("scroll"), stage: $("stage"),
    form: $("form"), input: $("input"), send: $("send")
  };

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    });
    children.forEach(c => node.append(c));
    return node;
  }

  // Inline **bold** without using innerHTML.
  function inline(text, parent) {
    text.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
      if (!part) return;
      if (part.startsWith("**") && part.endsWith("**")) {
        parent.append(el("strong", { text: part.slice(2, -2) }));
      } else {
        parent.append(document.createTextNode(part));
      }
    });
    return parent;
  }

  // Mini-format -> DOM.
  function renderRich(text) {
    const frag = document.createDocumentFragment();
    text.trim().split(/\n{2,}/).forEach(block => {
      const lines = block.split("\n");
      if (lines.every(l => l.startsWith("- "))) {
        const ul = el("ul");
        lines.forEach(l => ul.append(inline(l.slice(2), el("li"))));
        frag.append(ul);
      } else if (lines.every(l => l.startsWith("> "))) {
        frag.append(inline(lines.map(l => l.slice(2)).join(" "), el("p", { class: "note" })));
      } else {
        // Allow a lead-in paragraph directly followed by list lines.
        const split = lines.findIndex(l => l.startsWith("- "));
        if (split > 0) {
          frag.append(inline(lines.slice(0, split).join(" "), el("p")));
          const ul = el("ul");
          lines.slice(split).forEach(l => ul.append(inline(l.replace(/^- /, ""), el("li"))));
          frag.append(ul);
        } else {
          frag.append(inline(lines.join(" "), el("p")));
        }
      }
    });
    return frag;
  }


  const PROMPTS = [
    ["What does a flashing check engine light mean?", "Warning lights and urgency"],
    ["How often should I service my car?", "Oil, filters, fluids and plugs"],
    ["How do I look after an EV battery?", "Charging habits and winter range"],
    ["What should I check on a used car?", "Inspection checklist before buying"]
  ];

  function renderHero() {
    const hero = el("section", { class: "hero" }, [
      el("p", { class: "eyebrow", text: "CARGPT / AUTOMOTIVE ASSISTANT" }),
      el("h1", { text: "Ask anything about your car." }),
      el("p", { text: "Diagnostics, maintenance, tyres, brakes, EVs and buying advice. Clear answers, no guesswork." })
    ]);
    const grid = el("div", { class: "prompts" });
    PROMPTS.forEach(([title, sub], i) => {
      const b = el("button", { class: "prompt", type: "button" }, [
        el("span", { class: "prompt-num", text: String(i + 1).padStart(2, "0") }),
        el("span", {}, [el("span", { class: "prompt-title", text: title }), el("span", { class: "prompt-sub", text: sub })])
      ]);
      b.addEventListener("click", () => submit(title));
      grid.append(b);
    });
    hero.append(grid);
    return hero;
  }

  function messageNode(m) {
    const body = el("div", { class: "msg-body" });
    if (m.role === "user") body.textContent = m.content;
    else body.append(renderRich(m.content));
    return el("article", { class: "msg " + m.role }, [
      el("div", { class: "msg-role", text: m.role === "user" ? "You" : "CarGPT" }),
      body
    ]);
  }

  function typingNode() {
    const dots = el("div", { class: "typing", role: "status", "aria-label": "CarGPT is typing" },
      [el("span"), el("span"), el("span")]);
    return el("article", { class: "msg assistant", id: "typing" }, [
      el("div", { class: "msg-role", text: "CarGPT" }),
      el("div", { class: "msg-body" }, [dots])
    ]);
  }

  function renderStage() {
    const chat = activeChat();
    els.stage.replaceChildren();
    if (!chat || chat.messages.length === 0) {
      els.stage.append(renderHero());
    } else {
      const thread = el("div", { class: "thread", "aria-live": "polite" });
      chat.messages.forEach(m => thread.append(messageNode(m)));
      if (state.busy) thread.append(typingNode());
      els.stage.append(thread);
    }
    els.topTitle.textContent = chat && chat.title ? chat.title : "New conversation";
    els.scroll.scrollTop = els.scroll.scrollHeight;
  }

  function renderHistory() {
    els.history.replaceChildren();
    const chats = state.chats.filter(c => c.messages.length);
    if (!chats.length) {
      els.history.append(el("li", { class: "history-empty", text: "No conversations yet." }));
      return;
    }
    [...chats].reverse().forEach(c => {
      const open = el("button", { class: "history-item", type: "button", text: c.title });
      if (c.id === state.activeId) open.setAttribute("aria-current", "true");
      open.addEventListener("click", () => { state.activeId = c.id; save(); render(); closeMenu(); });
      const del = el("button", { class: "history-delete", type: "button", "aria-label": "Delete conversation", text: "×" });
      del.addEventListener("click", () => removeChat(c.id));
      els.history.append(el("li", {}, [open, del]));
    });
  }

  function render() { renderHistory(); renderStage(); }


  function newChat() {
    // Reuse an existing empty chat instead of piling them up.
    let chat = state.chats.find(c => c.messages.length === 0);
    if (!chat) {
      chat = { id: uid(), title: "", messages: [] };
      state.chats.push(chat);
    }
    state.activeId = chat.id;
    save(); render(); closeMenu();
    els.input.focus();
  }

  function removeChat(id) {
    state.chats = state.chats.filter(c => c.id !== id);
    if (state.activeId === id) state.activeId = null;
    save(); render();
  }

  async function submit(text) {
    text = text.trim();
    if (!text || state.busy) return;
    let chat = activeChat();
    if (!chat) {
      chat = { id: uid(), title: "", messages: [] };
      state.chats.push(chat);
      state.activeId = chat.id;
    }
    if (!chat.title) chat.title = text.length > 48 ? text.slice(0, 47) + "…" : text;
    chat.messages.push({ role: "user", content: text });
    state.busy = true;
    save(); render(); updateSend();

    let answer;
    try {
      answer = await CarGPTClient.reply(chat.messages);
    } catch (_) {
      answer = "Something went wrong reaching the assistant. Please try again.";
    }
    chat.messages.push({ role: "assistant", content: answer });
    state.busy = false;
    save(); render(); updateSend();
    els.input.focus();
  }


  function updateSend() {
    els.send.disabled = state.busy || !els.input.value.trim();
  }
  function autosize() {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
  }

  els.input.addEventListener("input", () => { autosize(); updateSend(); });
  els.input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      els.form.requestSubmit();
    }
  });
  els.form.addEventListener("submit", e => {
    e.preventDefault();
    const v = els.input.value;
    els.input.value = "";
    autosize(); updateSend();
    submit(v);
  });

  els.newChat.addEventListener("click", newChat);
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); newChat(); }
    if (e.key === "Escape") closeMenu();
  });

  function openMenu() { els.sidebar.classList.add("open"); els.scrim.classList.add("open"); }
  function closeMenu() { els.sidebar.classList.remove("open"); els.scrim.classList.remove("open"); }
  els.menuBtn.addEventListener("click", openMenu);
  els.scrim.addEventListener("click", closeMenu);

  load();
  if (!activeChat()) state.activeId = null;
  render();
  updateSend();
  els.input.focus();
})();
</script>
</body>
</html>
